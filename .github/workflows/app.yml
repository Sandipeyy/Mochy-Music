name: Build Mochy Music

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "ndk;27.0.12077973"
          yes | sdkmanager --licenses

      - name: Fix Linux build script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          s = p.read_text()
          p.write_text(s.replace("sed -i ''", "sed -i"))
          PY

      - name: Build APKs
        id: build
        run: |
          chmod +x gradlew build.sh
          set -o pipefail
          ./build.sh --debug -cc 2>&1 | tee build.log

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-APKs
          path: apk-generated/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          {
            echo "# Mochy Music Build Summary"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Job status: ${{ job.status }}"
            echo ""
            echo "## APK files"
            if ls apk-generated/*.apk >/dev/null 2>&1; then
              ls -lh apk-generated/*.apk
            else
              echo "No APKs generated."
            fi
            echo ""
            echo "## Build log"
            if [ -f build.log ]; then
              echo '```text'
              tail -n 100 build.log
              echo '```'
            else
              echo "Build log unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
