
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-APKs
          path: apk-generated/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          {
            echo "# Mochy Music Build Summary"
            echo ""
            echo "## Build information"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run: $GITHUB_RUN_NUMBER"
            echo ""
            echo "## Build result"
            echo "- Job status: ${{ job.status }}"
            echo ""
            echo "## APK files"
            if ls apk-generated/*.apk >/dev/null 2>&1; then
              ls -lh apk-generated/*.apk
            else
              echo "No APK files were generated."
            fi
            echo ""
            echo "## Failure information"
            echo "Check the failed step above for the exact error."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-Build-Logs
          path: |
            *.log
            build.log
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
