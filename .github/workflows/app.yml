name: Build Mochy Music

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses and Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Generate Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Fix Linux Build Script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.sh")
          s = p.read_text()
          s = s.replace("sed -i ''", "sed -i")
          p.write_text(s)
          PY

      - name: Build APKs
        run: |
          chmod +x gradlew build.sh
          set -o pipefail
          ./build.sh --debug -cc 2>&1 | tee build.log

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-APKs
          path: apk-generated/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          {
            echo "# Mochy Music Build Summary"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Job status: ${{ job.status }}"
            echo ""
            echo "## APK files"
            if ls apk-generated/*.apk >/dev/null 2>&1; then
              ls -lh apk-generated/*.apk
            else
              echo "No APKs generated."
            fi
            echo ""
            echo "## Build log"
            if [ -f build.log ]; then
              echo '```text'
              tail -n 150 build.log
              echo '```'
            else
              echo "Build log unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
